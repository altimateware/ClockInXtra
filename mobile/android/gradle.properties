org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled deliberately.
#
# It computes paths relative to the module directory, which fails outright when a
# source file lives on a different drive from the project. That happens here on
# Windows whenever the repository is on one drive and the pub cache
# (%LOCALAPPDATA%\Pub\Cache) is on another: compiling any plugin's Kotlin throws
#
#   IllegalArgumentException: this and base files have different roots
#
# naming a file in the pub cache and the project's android directory. The failure
# is in third-party plugin compilation, so it looks like a plugin bug rather than
# a layout problem, which makes it expensive to diagnose twice.
#
# The alternative is to put PUB_CACHE on the same drive as the checkout, which
# keeps incremental compilation. That is an environment change every developer
# and build agent has to make, so the correctness fix lives here in the
# repository where it applies to everyone, and the speed optimisation is left as
# an optional local choice.
kotlin.incremental=false
