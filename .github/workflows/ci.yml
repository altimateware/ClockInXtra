name: CI

# Build and run the whole .NET suite against a real SQL Server 2022.
#
# The integration tests are not mocked on purpose (Claude.md §50): the stored
# procedures are the contract, so a test with a faked connection would prove
# nothing that matters. That means CI needs a real database engine, and it has
# to be SQL Server 2022 or later, because the audit trail uses append-only
# ledger tables.
#
# This workflow takes no secrets. The SA password is generated per run and
# exists only for the life of the container, so nothing has to be stored in the
# repository or in GitHub (§47).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Started as a step rather than a `services:` container so the password
      # can be generated here. A `services:` block is created before any step
      # runs, so its environment would have to come from a stored secret.
      - name: Start SQL Server 2022
        run: |
          password="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"

          docker run -d --name mssql \
            -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=$password" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      # Waiting on the log line rather than polling with sqlcmd, which the
      # server image no longer ships. The loop fails the job rather than
      # letting the tests run against a server that never came up.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if docker logs mssql 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              echo "ready after ${i}0 seconds at most"
              exit 0
            fi
            if ! docker ps --filter name=mssql --filter status=running -q | grep -q .; then
              echo "::error::The SQL Server container stopped while starting."
              docker logs mssql
              exit 1
            fi
            sleep 1
          done
          echo "::error::SQL Server did not become ready."
          docker logs mssql
          exit 1

      # Every test project reads this, applying its own timeouts on top. SQL
      # authentication because there is no Windows domain here; the developer
      # default of Trusted_Connection does not apply on Linux.
      - name: Configure the test connection
        run: |
          echo "CLOCKINXTRA_TEST_CONNECTION=Server=127.0.0.1,1433;Database=ClockInXtra;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=60" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build ClockInXtra.slnx --configuration Release

      # The schema has to exist before the repository and procedure tests
      # connect, and they run in their own processes. Deployed through the
      # portal's own --deploy-database command, so CI uses the same code path a
      # host uses and no copy of the script order lives here.
      - name: Deploy the database
        env:
          ASPNETCORE_ENVIRONMENT: Development
          SqlServer__ConnectionString: ${{ env.CLOCKINXTRA_TEST_CONNECTION }}
          Database__AutoDeploy: "true"
          Database__Name: ClockInXtra
        run: dotnet run --project src/Attendance.Admin --configuration Release --no-build -- --deploy-database

      # Run per project. `dotnet test` needs --project in the
      # Microsoft.Testing.Platform mode global.json selects; the positional form
      # runs zero tests and exits 5 (toolchain finding T-1).
      - name: Test
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          failed=""
          for project in \
            tests/Attendance.Domain.Tests \
            tests/Attendance.Application.Tests \
            tests/Attendance.Infrastructure.Tests \
            tests/Attendance.Database.Tests \
            tests/Attendance.Api.Tests \
            tests/Attendance.Admin.Tests
          do
            echo "::group::$project"
            if ! dotnet test --project "$project" --configuration Release --no-build; then
              failed="$failed $project"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi

      - name: SQL Server log on failure
        if: failure()
        run: docker logs mssql | tail -50

      - name: Stop SQL Server
        if: always()
        run: docker rm -f mssql || true
