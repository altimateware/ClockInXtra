name: Deploy to VPS

# Publishes both hosts and installs them on the Ubuntu VPS over SSH.
#
# Deliberately NOT on every push to master. This deploys an attendance system
# that employees are clocking in and out of; a release is an act someone
# performs, not a side effect of merging. Run it from the Actions tab, or push
# a v* tag.
#
# What this workflow knows: how to reach the server. What it does not know: the
# database password, the key-ring certificate, or any other secret. Those live
# in /etc/clockinxtra/*.env on the VPS, root-owned and 0600, so they are
# managed by whoever administers the server and never pass through GitHub
# (Claude.md §47). The only secrets here are the SSH credentials.
#
# Setup is documented in docs/deployment/06-ubuntu-vps.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: false
        default: master
  push:
    tags: ["v*"]

concurrency:
  # One deployment at a time. Two overlapping releases would fight over the
  # symlink and the systemd restart.
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish and install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      REMOTE_ROOT: /opt/clockinxtra
      API_HEALTH: http://127.0.0.1:5001/health/ready
      ADMIN_HEALTH: http://127.0.0.1:5002/health/ready

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: |
          dotnet publish src/Attendance.Api/Attendance.Api.csproj \
            --configuration Release --runtime linux-x64 --no-self-contained \
            --output publish/api
          dotnet publish src/Attendance.Admin/Attendance.Admin.csproj \
            --configuration Release --runtime linux-x64 --no-self-contained \
            --output publish/admin

      # appsettings.Development.json carries developer defaults, including
      # TrustServerCertificate and an unencrypted key ring. It must never reach
      # a server: the host runs as Production, so it would be ignored, but a
      # file that cannot be read by mistake is better than one that is merely
      # not read today.
      - name: Remove development configuration from the payload
        run: find publish -name 'appsettings.Development.json' -delete -print

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned from a secret rather than accepted on first use: trusting an
          # unknown host key would let anything answering that address receive
          # the deployment.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload the release
        id: upload
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "release=$release" >> "$GITHUB_OUTPUT"

          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \
            "mkdir -p $REMOTE_ROOT/releases/$release/api $REMOTE_ROOT/releases/$release/admin"

          rsync -az --delete -e "ssh -i ~/.ssh/deploy -p $PORT" \
            publish/api/ "$USER@$HOST:$REMOTE_ROOT/releases/$release/api/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -p $PORT" \
            publish/admin/ "$USER@$HOST:$REMOTE_ROOT/releases/$release/admin/"

      # Before the symlink moves, so the schema is in place for the new code
      # while the old code is still serving. The scripts are idempotent and
      # additive, which is what makes that order safe; a release containing a
      # breaking schema change is not deployable this way and needs a window.
      - name: Deploy the database
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          RELEASE: ${{ steps.upload.outputs.release }}
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \n            "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -se" <<'REMOTE'
          set -euo pipefail
          set -a
          . /etc/clockinxtra/deploy.env
          set +a
          cd "$REMOTE_ROOT/releases/$RELEASE/admin"
          exec dotnet Attendance.Admin.dll --deploy-database
          REMOTE

      - name: Switch over and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          RELEASE: ${{ steps.upload.outputs.release }}
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \n            "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -se" <<'REMOTE'
          set -euo pipefail

          # Recorded before it moves, so a failed health check can put it back.
          if [ -L "$REMOTE_ROOT/current" ]; then
            readlink -f "$REMOTE_ROOT/current" > "$REMOTE_ROOT/previous.path"
          fi

          ln -sfn "$REMOTE_ROOT/releases/$RELEASE" "$REMOTE_ROOT/current.new"
          mv -Tf "$REMOTE_ROOT/current.new" "$REMOTE_ROOT/current"

          sudo systemctl restart clockinxtra-api clockinxtra-admin
          REMOTE

      # A deployment that starts and does not serve is a failed deployment. The
      # readiness probe covers the database, the key ring and, for the API, the
      # attendance configuration, so a 200 here means more than "the process is
      # alive".
      - name: Verify, and roll back if it does not serve
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \n            "REMOTE_ROOT='$REMOTE_ROOT' API_HEALTH='$API_HEALTH' ADMIN_HEALTH='$ADMIN_HEALTH' bash -se" <<'REMOTE'
          set -uo pipefail

          probe() {
            for _ in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$1" || true)"
              [ "$code" = "200" ] && { echo "  $1 -> 200"; return 0; }
              sleep 2
            done
            echo "  $1 -> $code"
            return 1
          }

          if probe "$API_HEALTH" && probe "$ADMIN_HEALTH"; then
            echo "Both hosts are serving."
            exit 0
          fi

          echo "::error::A host did not become ready. Rolling back."
          systemctl --no-pager status clockinxtra-api clockinxtra-admin || true
          journalctl -u clockinxtra-api -u clockinxtra-admin -n 60 --no-pager || true

          if [ -s "$REMOTE_ROOT/previous.path" ]; then
            ln -sfn "$(cat "$REMOTE_ROOT/previous.path")" "$REMOTE_ROOT/current.new"
            mv -Tf "$REMOTE_ROOT/current.new" "$REMOTE_ROOT/current"
            sudo systemctl restart clockinxtra-api clockinxtra-admin
            echo "Rolled back to $(cat "$REMOTE_ROOT/previous.path")."
          else
            echo "No previous release recorded; nothing to roll back to."
          fi
          exit 1
          REMOTE

      # Keeps the last five, so a rollback target always exists without the
      # disk filling up.
      - name: Prune old releases
        if: success()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" \n            "REMOTE_ROOT='$REMOTE_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          keep="$(readlink -f "$REMOTE_ROOT/current")"
          cd "$REMOTE_ROOT/releases"
          ls -1dt */ | tail -n +6 | while read -r dir; do
            [ "$(readlink -f "$dir")" = "$keep" ] && continue
            rm -rf -- "$dir"
            echo "pruned $dir"
          done
          REMOTE
